name: Pull Request Checks

on:
  pull_request:

permissions: {}

jobs:
  common-checks:
    name: Common Checks
    permissions:
      contents: read
      pull-requests: read
    uses: nownabe/workflows/.github/workflows/pr.yaml@c2b17684a106bc0e24a4de3e01db56d1a6ea3a79 # v2.1.0

  check-go:
    name: Check Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: go
      - name: Vet
        run: go vet ./...
      # The terminal code differs per OS, and the release builds are the
      # first place it would otherwise be compiled for Windows and macOS.
      - name: Vet for Windows and macOS
        run: GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - name: Test
        run: go test ./...

  result:
    name: Pull Request Checks
    if: always()
    needs:
      - common-checks
      - check-go
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: '[[ "$HAS_FAILURE" == "false" && "$HAS_CANCELLED" == "false" ]]'
