name: Publish

# Builds the artifacts for a v* tag created by release-please, uploads them to
# the draft GitHub Release, and publishes it. The Release starts as a draft so
# that every artifact is attached before it becomes public, which also keeps
# this flow working when releases are immutable.
on:
  push:
    tags:
      - v*

permissions: {}

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    environment: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Find the draft release, upload assets to it, and publish it.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@be3be2260bc02bc3fbf94c5e2fed8b7964baf074 # v3.4.0
        with:
          install_args: go aqua:goreleaser/goreleaser
          # A poisoned cache could taint the released binaries.
          cache: false
      - name: Test
        run: go vet ./... && go test ./...
      # release-please pushes the tag before it creates the draft. Without the
      # draft, GoReleaser would create a separate release instead.
      - name: Wait for the draft release
        run: |
          for _ in $(seq 30); do
            if gh api "repos/$GITHUB_REPOSITORY/releases" | jq -e --arg name "$GITHUB_REF_NAME" 'any(.[]; .draft and .name == $name)' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::No draft release named $GITHUB_REF_NAME"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
